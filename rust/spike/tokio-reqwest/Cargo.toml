[package]
name = "spike-tokio-reqwest"
version = "0.0.0"
edition = "2021"
publish = false

[dependencies]
wh-proto = { path = "../../crates/wh-proto" }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls-native-roots", "json"] }
serde_json = "1"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
