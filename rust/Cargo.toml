[workspace]
resolver = "2"
members = [
  "crates/wh-proto",
  "crates/wh-core",
  "crates/wh-platform",
  "crates/wh-ipc",
  "crates/wh-cli",
  "crates/wheelhouse",
]
# The spikes are measured separately and are not part of the product build.
exclude = ["spike/tokio-reqwest", "spike/ureq-threads"]

[workspace.package]
edition = "2021"
version = "0.0.0"
license = "MIT"
rust-version = "1.80"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
ed25519-dalek = { version = "2", features = ["pkcs8", "rand_core"] }
rand = "0.8"
uuid = { version = "1", features = ["v4"] }

# Spec section 11.
[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
