name: rust

on:
  push:
    branches: [main]
    paths: ["rust/**", "daemon/src/crypto.mjs", "daemon/src/connection.mjs", ".github/workflows/rust.yml"]
  pull_request:
    paths: ["rust/**", "daemon/src/crypto.mjs", "daemon/src/connection.mjs", ".github/workflows/rust.yml"]

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: macos-arm64, os: macos-14 }
          - { name: macos-x86_64, os: macos-13 }
          - { name: windows-x86_64, os: windows-latest }
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: rust
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            rust
            rust/spike/tokio-reqwest
            rust/spike/ureq-threads

      - name: Fixtures from the Node code
        run: node tools/gen-fixtures.mjs
      - name: Format
        run: cargo fmt --all --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Tests (crypto fixtures and Node property test)
        run: cargo test --workspace

      - name: Release build
        run: cargo build --release --workspace
      - name: Release build, spike tokio+reqwest
        shell: bash
        run: |
          start=$(date +%s)
          cargo build --release --manifest-path spike/tokio-reqwest/Cargo.toml
          echo "tokio-reqwest clean-ish build: $(( $(date +%s) - start ))s" | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Release build, spike ureq+threads
        shell: bash
        run: |
          start=$(date +%s)
          cargo build --release --manifest-path spike/ureq-threads/Cargo.toml
          echo "ureq-threads clean-ish build: $(( $(date +%s) - start ))s" | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Size gate
        shell: bash
        run: node tools/size-gate.mjs target/release spike/tokio-reqwest/target/release spike/ureq-threads/target/release
